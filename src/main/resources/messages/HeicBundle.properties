group.advanced.settings.heic=HEIC Viewer

advanced.setting.heic.viewer.max.megapixels=Maximum decoded image size
advanced.setting.heic.viewer.max.megapixels.trailingLabel=megapixels
advanced.setting.heic.viewer.max.megapixels.description=HEIC/HEIF images with more pixels are downscaled while decoding (aspect ratio preserved) to limit memory use; the Git diff decodes two images at once. The longer side is also limited to 16384 pixels. Allowed range: 1-512.

advanced.setting.heic.viewer.project.view.thumbnails=Show thumbnails as HEIC file icons
advanced.setting.heic.viewer.project.view.thumbnails.description=Shows a small preview of local HEIC/HEIF files (up to 64 MB) as their icon in the Project view, editor tabs, navigation bar and file lists. Thumbnails are decoded in the background; the Image icon is shown until they are ready.

advanced.setting.heic.viewer.libheif.path=libheif library
advanced.setting.heic.viewer.libheif.path.description=Path of libheif.so.1, or of the directory that contains it, for a libheif outside the system's library search path (e.g. on NixOS, or a libheif you built yourself). Empty: the system's libheif. Takes effect at the next IDE start (with "Check Again" in the HEIC Viewer banner or notification only while no libheif has been loaded: a second libheif is never loaded next to the first).

notification.group.heic=HEIC Viewer

# The system HEIF decoder is unavailable: remedies (cn.yooss.heic.backend.HeifRemedies) shown by the editor banner and
# the balloons (cn.yooss.heic.ui). remedy.title.<REASON>: banner text and balloon title; backend.status.<REASON> (below):
# the explanation (balloon content, banner tooltip).
# Messages with parameters ({0}) are MessageFormat patterns: no single quotes there.
remedy.title.WINDOWS_HEIF_EXTENSION_MISSING=HEIC images need the HEIF Image Extension
remedy.title.WINDOWS_HEVC_EXTENSION_MISSING=HEIC images need the HEVC Video Extensions
remedy.title.LINUX_LIBHEIF_MISSING=HEIC images need libheif
remedy.title.LINUX_HEVC_PLUGIN_MISSING=HEIC images need an HEVC decoder for libheif
remedy.title.UNSUPPORTED_OS=HEIC images cannot be shown on this system
remedy.title.ERROR=HEIC images cannot be shown: the system HEIF decoder could not be loaded
