remedy.check.available.content=The system HEIF decoder is available; open HEIC images were reloaded. Reopen diffs that show "Image not loaded".
remedy.check.missing.title=The system HEIF decoder is still not available
remedy.check.missing.restart=If you have just installed it, restart the IDE: Windows may make a newly installed Store extension available only to programs started afterwards.

backend.status.WINDOWS_HEIF_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows, which needs the free <b>HEIF Image Extension</b> from the Microsoft Store. HEIC photos also need the <b>HEVC Video Extensions</b> (preinstalled on some PCs).
backend.status.WINDOWS_HEVC_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows, which also needs the <b>HEVC Video Extensions</b> from the Microsoft Store (the codec of HEIC photos).
backend.status.LINUX_LIBHEIF_MISSING=HEIC/HEIF images are decoded by the system's <b>libheif</b> (libheif.so.1), which was not found. Install it with its HEVC decoder (libde265) from your distribution's packages, or set its location in <i>Settings | Advanced Settings | HEIC Viewer</i>.
backend.status.LINUX_HEVC_PLUGIN_MISSING=The system's <b>libheif</b> has no HEVC decoder, which HEIC photos need. Install its libde265 plugin from your distribution's packages.
backend.status.LINUX_LIBHEIF_MISSING.flatpak=The IDE runs as a Flatpak and only sees the libraries of its Flatpak runtime, which has no usable <b>libheif</b>. Flatpak installs the runtime's extensions on the host.
backend.status.LINUX_HEVC_PLUGIN_MISSING.flatpak=The IDE runs as a Flatpak and uses the <b>libheif</b> of its Flatpak runtime, which has no HEVC decoder, which HEIC photos need. The decoder is the runtime's <b>codecs-extra</b> extension, which Flatpak installs on the host.
backend.status.UNSUPPORTED_OS=HEIC/HEIF images cannot be shown on this operating system.
backend.status.ERROR=The system HEIF decoder could not be loaded; see idea.log for details.
