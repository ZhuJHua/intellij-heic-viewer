decoder.available.title=HEIC images can be shown now
decoder.available.content=The system HEIF decoder is available. Reopen HEIC files that show "Image not loaded".

backend.status.WINDOWS_HEIF_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows, which needs the free <b>HEIF Image Extension</b> from the Microsoft Store. HEIC photos also need the <b>HEVC Video Extensions</b> (preinstalled on some PCs).
backend.status.WINDOWS_HEVC_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows, which also needs the <b>HEVC Video Extensions</b> from the Microsoft Store (the codec of HEIC photos).
backend.status.LINUX_LIBHEIF_MISSING=HEIC/HEIF images are decoded by the system's <b>libheif</b> (libheif.so.1), which is not installed.
backend.status.LINUX_HEVC_PLUGIN_MISSING=The system's <b>libheif</b> has no HEVC decoder. Install its libde265 plugin (e.g. libheif-plugin-libde265).
backend.status.UNSUPPORTED_OS=HEIC/HEIF images cannot be shown on this operating system.
backend.status.NOT_IMPLEMENTED=HEIC/HEIF images cannot be shown on this operating system yet.
backend.status.ERROR=The system HEIF decoder could not be loaded; see idea.log for details.
