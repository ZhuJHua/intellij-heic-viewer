group.advanced.settings.heic=HEIC Viewer

advanced.setting.heic.viewer.max.megapixels=Maximum decoded image size
advanced.setting.heic.viewer.max.megapixels.trailingLabel=megapixels
advanced.setting.heic.viewer.max.megapixels.description=HEIC/HEIF images with more pixels are downscaled while decoding (aspect ratio preserved) to limit memory use; the Git diff decodes two images at once. The longer side is also limited to 16384 pixels. Allowed range: 1-512.

advanced.setting.heic.viewer.project.view.thumbnails=Show thumbnails as HEIC file icons
advanced.setting.heic.viewer.project.view.thumbnails.description=Shows a small preview of local HEIC/HEIF files (up to 64 MB) as their icon in the Project view, editor tabs, navigation bar and file lists. Thumbnails are decoded in the background; the Image icon is shown until they are ready.

advanced.setting.heic.viewer.libheif.path=libheif library
advanced.setting.heic.viewer.libheif.path.description=Path of libheif.so.1, or of the directory that contains it, for a libheif outside the system's library search path (e.g. on NixOS, or a libheif you built yourself). Empty: the system's libheif. Takes effect at the next IDE start or with "Check Again" in the HEIC Viewer notification.

notification.group.heic=HEIC Viewer

decoder.missing.title=HEIC images need a system decoder
decoder.missing.command=Install it with:
decoder.action.install=Get It…
decoder.action.copy.command=Copy Command
decoder.action.check.again=Check Again
decoder.action.dont.show.again=Don't Show Again
decoder.available.title=HEIC images can be shown now
decoder.available.content=The system HEIF decoder is available. Reopen HEIC files that show "Image not loaded".

backend.status.WINDOWS_HEIF_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows. Install the free <b>HEIF Image Extensions</b> from the Microsoft Store.
backend.status.WINDOWS_HEVC_EXTENSION_MISSING=HEIC/HEIF images are decoded by Windows, which also needs the <b>HEVC Video Extensions</b> from the Microsoft Store (the codec of HEIC photos).
backend.status.LINUX_LIBHEIF_MISSING=HEIC/HEIF images are decoded by the system's <b>libheif</b> (libheif.so.1), which was not found. Install it with its HEVC decoder (libde265) from your distribution's packages, or set its location in <i>Settings | Advanced Settings | HEIC Viewer</i>.
backend.status.LINUX_HEVC_PLUGIN_MISSING=The system's <b>libheif</b> has no HEVC decoder, which HEIC photos need. Install its libde265 plugin from your distribution's packages.
backend.status.UNSUPPORTED_OS=HEIC/HEIF images cannot be shown on this operating system.
backend.status.NOT_IMPLEMENTED=HEIC/HEIF images cannot be shown on this operating system yet.
backend.status.ERROR=The system HEIF decoder could not be loaded; see idea.log for details.
