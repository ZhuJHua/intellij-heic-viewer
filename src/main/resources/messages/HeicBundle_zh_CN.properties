group.advanced.settings.heic=HEIC Viewer

advanced.setting.heic.viewer.max.megapixels=解码图片的最大尺寸
advanced.setting.heic.viewer.max.megapixels.trailingLabel=百万像素
advanced.setting.heic.viewer.max.megapixels.description=像素数超过该值的 HEIC/HEIF 图片会在解码时按比例缩小，以限制内存占用（Git 差异对比会同时解码两张图片）。较长边同样限制在 16384 像素以内。允许范围：1-512。

advanced.setting.heic.viewer.project.view.thumbnails=用缩略图作为 HEIC 文件图标
advanced.setting.heic.viewer.project.view.thumbnails.description=在项目视图、编辑器标签页、导航栏和文件列表中，把本地 HEIC/HEIF 文件（不超过 64 MB）的图标显示为图片的小缩略图。缩略图在后台解码，完成之前显示普通的图片图标。

advanced.setting.heic.viewer.libheif.path=libheif 库
advanced.setting.heic.viewer.libheif.path.description=libheif.so.1 或其所在目录的路径，用于不在系统库搜索路径中的 libheif（例如 NixOS 上的 libheif，或自行编译的 libheif）。留空则使用系统的 libheif。下次启动 IDE 或在 HEIC Viewer 通知中点击“重新检测”后生效。

notification.group.heic=HEIC Viewer

decoder.missing.title=显示 HEIC 图片需要系统解码器
decoder.missing.command=安装命令：
decoder.action.install=获取…
decoder.action.copy.command=复制命令
decoder.action.check.again=重新检测
decoder.action.dont.show.again=不再显示
decoder.available.title=现在可以显示 HEIC 图片了
decoder.available.content=系统 HEIF 解码器已可用。请重新打开显示“Image not loaded”的 HEIC 文件。

backend.status.WINDOWS_HEIF_EXTENSION_MISSING=HEIC/HEIF 图片由 Windows 解码。请从 Microsoft Store 安装免费的 <b>HEIF 图像扩展</b>（HEIF Image Extensions）。
backend.status.WINDOWS_HEVC_EXTENSION_MISSING=HEIC/HEIF 图片由 Windows 解码，还需要 Microsoft Store 中的 <b>HEVC 视频扩展</b>（HEVC Video Extensions，HEIC 照片使用的编码）。
backend.status.LINUX_LIBHEIF_MISSING=HEIC/HEIF 图片由系统的 <b>libheif</b>（libheif.so.1）解码，但没有找到它。请从发行版的软件包中安装 libheif 及其 HEVC 解码器（libde265），或在<i>设置 | 高级设置 | HEIC Viewer</i> 中指定它的位置。
backend.status.LINUX_HEVC_PLUGIN_MISSING=系统的 <b>libheif</b> 缺少 HEIC 照片所需的 HEVC 解码器。请从发行版的软件包中安装它的 libde265 插件。
backend.status.UNSUPPORTED_OS=当前操作系统无法显示 HEIC/HEIF 图片。
backend.status.NOT_IMPLEMENTED=当前操作系统暂不支持显示 HEIC/HEIF 图片。
backend.status.ERROR=无法加载系统 HEIF 解码器，详情见 idea.log。
