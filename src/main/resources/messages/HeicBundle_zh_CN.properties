backend.status.WINDOWS_HEIF_EXTENSION_MISSING=HEIC/HEIF 图片由 Windows 解码，需要 Microsoft Store 中免费的 <b>HEIF 图像扩展</b>（HEIF Image Extension）。HEIC 照片还需要 <b>HEVC 视频扩展</b>（HEVC Video Extensions，部分电脑已预装）。
backend.status.WINDOWS_HEVC_EXTENSION_MISSING=HEIC/HEIF 图片由 Windows 解码，还需要 Microsoft Store 中的 <b>HEVC 视频扩展</b>（HEVC Video Extensions，HEIC 照片使用的编码）。
backend.status.LINUX_LIBHEIF_MISSING=HEIC/HEIF 图片由系统的 <b>libheif</b>（libheif.so.1）解码，但没有找到它。请从发行版的软件包中安装 libheif 及其 HEVC 解码器（libde265）。
backend.status.LINUX_HEVC_PLUGIN_MISSING=系统的 <b>libheif</b> 缺少 HEIC 照片所需的 HEVC 解码器。请从发行版的软件包中安装它的 libde265 插件。
backend.status.LINUX_LIBHEIF_MISSING.flatpak=IDE 以 Flatpak 方式运行，只能使用其 Flatpak 运行时中的库，其中没有可用的 <b>libheif</b>。运行时的扩展需要在宿主机上用 Flatpak 安装。
backend.status.LINUX_HEVC_PLUGIN_MISSING.flatpak=IDE 以 Flatpak 方式运行，使用其 Flatpak 运行时中的 <b>libheif</b>，但其中没有 HEIC 照片所需的 HEVC 解码器。该解码器是运行时的 <b>codecs-extra</b> 扩展，需要在宿主机上用 Flatpak 安装。
backend.status.UNSUPPORTED_OS=当前操作系统无法显示 HEIC/HEIF 图片。
backend.status.ERROR=无法加载系统 HEIF 解码器，详情见 idea.log。
