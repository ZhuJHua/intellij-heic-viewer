name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:

  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: A clear and concise description of the problem, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        How to trigger the problem. If it concerns a particular image, please attach it (only if you are allowed to
        share it) or describe it: which device or tool created it, dimensions, bit depth.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Lines from idea.log (Help | Show Log in Finder / Explorer / Files) that mention HEIC or cn.yooss.heic, including
        stack traces. Please always include the line that starts with `HEIC decoder:`; it names the decoder the plugin
        found (ImageIO, Windows Imaging Component, or libheif with its version and path) or what is missing.

        *This will be automatically formatted into code, so there is no need for backticks.*
      render: shell

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE and version
      description: From Help | About (or the About dialog), including the build number.
      placeholder: Android Studio Quail 4 | 2026.1.4 Patch 1, build AI-261.26222.65.2614.16379836
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system, version and CPU architecture
      description: On Linux, also the distribution and how libheif was installed (package names, Flatpak).
      placeholder: macOS 26.0 Apple silicon / Windows 11 24H2 x64 / Ubuntu 24.04 arm64
    validations:
      required: true

  - type: textarea
    id: windows-extensions
    attributes:
      label: "Windows only: installed HEIF and HEVC extensions"
      description: |
        The output of this PowerShell command (optional):
        `Get-AppxPackage *HEIFImageExtension*; Get-AppxPackage *HEVCVideoExtension*`
      render: shell
