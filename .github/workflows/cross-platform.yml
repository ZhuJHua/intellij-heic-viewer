# GitHub Actions workflow that builds the plugin and runs the unit tests on every supported OS and architecture, on the
# three Java runtimes the supported IDEs use (JDK 25: 2026.1.3+; JDK 21: 2024.2 - 2026.1.2; JDK 17: 2024.1):
#   macOS arm64 and x86_64      ImageIO.framework through the IDE's JNA (x86_64 passes CGRect by value differently)
#   Linux x64 / arm64           the system libheif through the IDE's JNA: 1.17 with the libde265 plugin (x64, arm64),
#                               1.12 (x64, Ubuntu 22.04), 1.17 without HEVC decoder (x64), no libheif (x64)
#   Windows x64 / arm64         WIC
# HEIC_EXPECT_BACKEND is the status HeifBackendContractTest requires of the system decoder on that runner: "available",
# or the HeifBackendStatus.Reason the backend must report (e.g. LINUX_LIBHEIF_MISSING; the Windows backend is a
# placeholder so far: NOT_IMPLEMENTED). Test reports are uploaded for every job.
#
# The IDE to compile against (platformType/platformVersion in gradle.properties) is downloaded for the runner's OS and
# cached. Plugin Verifier runs against pluginVerificationIdes in a separate job (like the Build workflow).
#
# Triggered by pushes to dev/** branches and manually.

name: Cross-platform

on:
  push:
    branches: [ 'dev/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            expect: available
          - name: macOS x86_64
            os: macos-15-intel
            expect: available
          # libheif 1.17 with its codecs as plugins; the HEVC one (libheif-plugin-libde265) is only suggested since
          # 1.17.6-1ubuntu4.3, so the second job has libheif without HEVC decoder.
          - name: Linux x64, libheif
            os: ubuntu-24.04
            libheif: install
            expect: available
          - name: Linux x64, libheif without HEVC
            os: ubuntu-24.04
            libheif: no-hevc
            expect: LINUX_HEVC_PLUGIN_MISSING
          - name: Linux x64, no libheif
            os: ubuntu-24.04
            libheif: remove
            expect: LINUX_LIBHEIF_MISSING
          # libheif 1.12: no heif_init, no plugins (libde265 linked in), the oldest libheif of a supported LTS.
          - name: Linux x64, libheif 1.12
            os: ubuntu-22.04
            libheif: install
            expect: available
          # Android Studio has no Linux/Windows arm64 build: compile against IntelliJ IDEA there (its arm64 build ships
          # JNA's native library for arm64, which the Linux and Windows backends need). A 2026.1 build like the Android
          # Studio in gradle.properties: the 2026.2 platform jars are too new for the JDK 17/21 test runs.
          - name: Linux arm64, libheif
            os: ubuntu-24.04-arm
            libheif: install
            platform: -PplatformType=IU -PplatformVersion=2026.1.5
            expect: available
          - name: Windows x64
            os: windows-latest
            expect: NOT_IMPLEMENTED
          - name: Windows arm64
            os: windows-11-arm
            platform: -PplatformType=IU -PplatformVersion=2026.1.5
            expect: NOT_IMPLEMENTED
    env:
      HEIC_EXPECT_BACKEND: ${{ matrix.expect }}
    defaults:
      run:
        shell: bash
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6

      # The libheif states of the Linux jobs; the commands are those the plugin suggests (see LibheifRemedy).
      - name: Install libheif
        if: ${{ matrix.libheif == 'install' }}
        run: |
          sudo apt-get update
          # Ubuntu 23.10+ splits the codecs into plugin packages; before, libde265 is linked into libheif1.
          if apt-cache show libheif-plugin-libde265 > /dev/null 2>&1; then plugin=libheif-plugin-libde265; fi
          sudo apt-get install -y --no-install-recommends libheif1 $plugin
          dpkg -l 'libheif*' | grep ^ii
          ls /usr/lib/*/libheif/plugins 2> /dev/null || true

      - name: Install libheif without HEVC decoder
        if: ${{ matrix.libheif == 'no-hevc' }}
        run: |
          sudo apt-get update
          sudo apt-get purge -y 'libheif*' || true
          sudo apt-get install -y --no-install-recommends libheif1
          dpkg -l 'libheif*' | grep ^ii
          ls /usr/lib/*/libheif/plugins
          if ls /usr/lib/*/libheif/plugins | grep -E 'libde265|ffmpegdec'; then echo "::error::an HEVC plugin is installed"; exit 1; fi

      - name: Remove libheif
        if: ${{ matrix.libheif == 'remove' }}
        run: |
          sudo apt-get purge -y 'libheif*' || true
          if ldconfig -p | grep libheif; then echo "::error::libheif is still installed"; exit 1; fi

      # JDK 25 runs Gradle and compiles (--release 17); the test tasks use JDK 25, 21 and 17 as Gradle toolchains.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The downloaded IDE archive (about 1.5 GB), per OS/architecture, platform override and gradle.properties.
      # (setup-gradle may move the Gradle user home, e.g. to D:\a\.gradle on Windows x64.)
      - name: Cache IDE
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/com.google.android.studio
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/idea
          key: ide-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('gradle.properties') }}

      # testJdk25 rather than `test`, which the IntelliJ Platform Gradle Plugin only runs on the IDE's architectures.
      - name: Build and test
        run: >
          ./gradlew buildPlugin testJdk25 testJdk21 testJdk17 --continue ${{ matrix.platform }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_${{ runner.arch }},JAVA_HOME_21_${{ runner.arch }},JAVA_HOME_25_${{ runner.arch }}

      # The plugin inside a light IDE (IntelliJ test framework, the `test` task, which needs an IDE build for the runner's
      # architecture): plugin.xml as the IDE reads it (e.g. the Linux-only setting) and IfsUtil decoding through libheif.
      - name: Light IDE test
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        run: ./gradlew test --tests cn.yooss.heic.HeicPlatformIntegrationTest --continue ${{ matrix.platform }}

      # Which native JNA directories the IDE provides (JNA can only be used in tests on the runner's architecture).
      - name: Show the IDE's JNA native directories
        if: ${{ always() }}
        run: |
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          if command -v cygpath > /dev/null; then home="$(cygpath -u "$home")"; fi
          find "$home/caches" -type d -path '*lib/jna/*' -prune 2>/dev/null | head -20 || true

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.libheif || 'default' }}
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore

  # The install commands the plugin suggests on Linux (LibheifRemedy), run in containers of the distributions: the
  # classes built here are mounted into each container together with JNA and a JDK (.github/scripts/linux-install-check.sh).
  install-classes:
    name: Linux install commands (build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Cache IDE
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/com.google.android.studio
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/idea
          key: ide-${{ runner.os }}-${{ runner.arch }}--${{ hashFiles('gradle.properties') }}

      - name: Build classes
        run: |
          ./gradlew testClasses
          mkdir -p out/classes out/resources
          cp -r build/classes/java/main build/classes/java/test out/classes/
          cp -r build/resources/main build/resources/test out/resources/
          # JNA as in IntelliJ 2024.1 (the IDEs bundle it; here it comes from Maven Central, with its native part)
          curl -fsSL -o out/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar

      - name: Upload classes
        uses: actions/upload-artifact@v7
        with:
          name: linux-install-classes
          path: out

  install:
    name: Linux install commands (${{ matrix.image }})
    needs: install-classes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # libheif 1.6.1: images with alpha fail (heif_error 7/129) and it does not read the 10-bit brand heix (3/0);
          # 8-bit images, grids, transformations, thumbnails and ICC profiles work.
          - image: ubuntu:20.04
            prepare: apt-get update
            known: alpha_sips.heic,alpha_libheif.heic,rgb16_sips.heic,ten_bit.heic
          - image: debian:11
            prepare: apt-get update
          - image: ubuntu:22.04
            prepare: apt-get update
          - image: ubuntu:24.04
            prepare: apt-get update
          - image: debian:12
            prepare: apt-get update
          - image: debian:13
            prepare: apt-get update
          - image: fedora:latest
          - image: almalinux:9
          - image: opensuse/tumbleweed
          - image: opensuse/leap:15.6
          - image: archlinux:latest
          - image: alpine:3.22
            mode: alpine
          - image: nixos/nix
            prepare: nix-channel --update
            mode: nix
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Download classes
        uses: actions/download-artifact@v8
        with:
          name: linux-install-classes
          path: w

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Run the suggested install command
        run: >
          docker run --rm -e PREPARE="${{ matrix.prepare }}" -e KNOWN="${{ matrix.known }}"
          -v "$PWD/w:/w:ro" -v "$JAVA_HOME:/jdk:ro" -v "$PWD/.github/scripts:/scripts:ro"
          ${{ matrix.image }} sh /scripts/linux-install-check.sh ${{ matrix.mode || 'java' }}

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      # The IDEs in pluginVerificationIdes need more disk space than a runner has free by default.
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
