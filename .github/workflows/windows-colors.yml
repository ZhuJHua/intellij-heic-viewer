# Experiment (branch dev/0.2-colour): the colors of Microsoft's HEIF decoder with and without the plugin's workarounds
# (SingleImageGrid, NclxTransfer), on the only GitHub runner with the HEIF Image Extension and the HEVC Video Extension
# (Windows 11 arm64), set up like the "Windows arm64" job of cross-platform.yml. WicColorTest prints, per fixture, the
# quadrant pixels, the mean difference to the source PNG and the decode time, as WIC decodes the file and as the plugin
# does; the report is printed and uploaded.
name: Windows colors

on:
  push:
    branches: [ 'dev/0.2-colour' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  colors:
    name: Windows colors (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      HEIC_EXPECT_BACKEND: available
    defaults:
      run:
        shell: bash
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Windows codec packages
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          Get-AppxPackage -AllUsers | Where-Object { $_.Name -match 'HEIF|HEVC' } |
            Select-Object Name, Version, Architecture | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: JNA native library for ${{ runner.arch }}
        env:
          JNA_VERSION: '5.17.0'
          # sha256 of https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar
          JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/jna-natives"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/jna.jar" "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          echo "$JNA_SHA256  $dir/jna.jar" | sha256sum -c -
          unzip -j -o "$dir/jna.jar" 'com/sun/jna/win32-aarch64/jnidispatch.dll' -d "$dir/win32-aarch64"
          echo "JNA_NATIVE_DIR_ARG=-PjnaNativeDir=$(cygpath -m "$dir/win32-aarch64")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache IDE
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/com.google.android.studio
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/idea
          key: ide-${{ runner.os }}-${{ runner.arch }}--PplatformType=IU -PplatformVersion=2026.1.5-${{ hashFiles('gradle.properties') }}

      # The Windows backend's tests (WicColorTest among them) and the shared color comparisons, on JDK 25 and 17.
      - name: Color tests
        run: >
          ./gradlew testJdk25 testJdk17 --continue -PplatformType=IU -PplatformVersion=2026.1.5 ${{ env.JNA_NATIVE_DIR_ARG }}
          --tests 'cn.yooss.heic.win.*' --tests 'cn.yooss.heic.backend.HeifBackendContractTest'
          --tests 'cn.yooss.heic.HeicImageIoIntegrationTest'
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_${{ runner.arch }},JAVA_HOME_21_${{ runner.arch }},JAVA_HOME_25_${{ runner.arch }}

      - name: Color report
        if: ${{ always() }}
        run: cat build/reports/color/wic-colors.txt || echo "no report"

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-colors
          path: |
            build/reports/color
            build/reports/tests
            build/test-results
          if-no-files-found: ignore
