# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.
# A pre-release publishes to the channel named by the pluginVersion suffix (e.g. 0.2.0-beta.1 -> "beta"), a release
# to the default channel.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Record build provenance for the release zips and for every file inside them, so that an installed or downloaded
      # copy can be checked with `gh attestation verify` (README, "Verifying a copy"). JetBrains Marketplace adds its
      # own signature to the zip but leaves the files inside it unchanged, so those files are what a user checks.
      - name: List Attestation Subjects
        run: |
          rm -rf build/attestation
          mkdir -p build/attestation/unpacked
          for zip in build/distributions/*.zip; do
            unzip -q "$zip" -d "build/attestation/unpacked/$(basename "$zip" .zip)"
          done
          find build/distributions build/attestation/unpacked -type f -print0 \
            | xargs -0 shasum -a 256 > build/attestation/checksums.txt
          cat build/attestation/checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/attestation/checksums.txt

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # Create a pull request
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          # Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH \
            || echo "::warning::Could not open the changelog PR (enable 'Allow GitHub Actions to create and approve pull requests'). Open it manually: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH"
