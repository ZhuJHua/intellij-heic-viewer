# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = cn.yooss.heic
pluginName = HEIC Viewer
pluginRepositoryUrl = https://github.com/ZhuJHua/intellij-heic-viewer
# SemVer format -> https://semver.org
pluginVersion = 0.1.0

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 261.26222 = Android Studio 2026.1.3 / IntelliJ IDEA 2026.1.4, the first 261 builds that run on JBR 25. The plugin is
# compiled for Java 22 (FFM API); Android Studio 2026.1.1 and 2026.1.2 (261.23567 / 261.25134) still run on JBR 21 and
# could not load it. No until-build: open-ended.
pluginSinceBuild = 261.26222

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
# Target platform downloaded when no local IDE is configured (CI, fresh clones); see platformLocalPath in README.md.
# AI = Android Studio; versions: https://jb.gg/android-studio-releases-list.xml (2026.1.4.8 = Quail 4 Patch 1, AI-261.26222.65)
platformType = AI
platformVersion = 2026.1.4.8

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins = com.intellij.platform.images
# Example: platformBundledModules = intellij.spellchecker
platformBundledModules =

# IDEs checked by `verifyPlugin` when no local IDE is configured (CI), as <type>-<version>:
#   AI-2026.1.3.8  Android Studio Quail 3 Patch 1 (AI-261.26222.65): lowest supported Android Studio, the since-build boundary
#   IU-2026.1.5    IntelliJ IDEA 2026.1.5 (261.27258.48): latest 2026.1 release
#   IU-2026.2.3    IntelliJ IDEA 2026.2.3 (262.10968.63): latest release, current platform branch 262
pluginVerificationIdes = AI-2026.1.3.8, IU-2026.1.5, IU-2026.2.3

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.4.1

# Machine-specific settings (local IDE paths, JDK) do not belong here: put them into the git-ignored local.properties
# (see README.md, "Development").

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
# (the plugin is pure Java; only relevant if a Kotlin plugin is ever applied)
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
